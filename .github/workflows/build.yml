name: Build

# Packaging workflow: only fires on master, unlike the tests workflow which runs
# on every branch and pull request.
#
# Every job needs the same two things, and missing either one stops the build
# before a single file compiles:
#   * Qt 6 with the qtserialbus and qtserialport add-ons. The project asks for
#     them in SavvyCAN.pro, they are not part of the base Qt install, and qmake
#     stops at "Unknown module(s) in QT" without them.
#   * libusb development headers, which the gs_usb/Candlelight backend links
#     against. Windows uses the copy in third_party, Linux and macOS pick up the
#     system one (see the unix block in SavvyCAN.pro).
on:
  push:
    branches:
      - "master"
  workflow_dispatch:

jobs:
  buildlinux:
    name: Linux x64
    runs-on: ubuntu-22.04

    steps:
      - name: Clone
        uses: actions/checkout@v7

      # apt-get update first - without it the install can fail on a stale index.
      # libfuse2 is what lets the packaged AppImage run.
      - name: Prepare Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-xinerama0 libxcb-randr0 libxkbcommon-x11-0 libxcb-cursor0 \
            libusb-1.0-0-dev libfuse2

      - name: Prepare Qt Libraries
        uses: jurplel/install-qt-action@v4
        with:
          modules: qtserialbus qtserialport

      - name: Compile
        run: |
          qmake CONFIG+=release PREFIX=/usr SavvyCAN.pro
          make -j$(nproc)
          lrelease translations/*.ts

      - name: Package
        run: |
          set -x
          make INSTALL_ROOT=appdir install
          find appdir -maxdepth 4 -type d
          # SavvyCAN loads its translations from applicationDirPath()/translations,
          # and the binary installs to /usr/bin, so they belong next to it. An
          # unexpanded glob here must not take the whole release build down.
          shopt -s nullglob
          qm=(translations/*.qm)
          mkdir -p appdir/usr/bin/translations
          if [ ${#qm[@]} -gt 0 ]; then
            cp "${qm[@]}" appdir/usr/bin/translations/
          else
            echo "WARNING: lrelease produced no .qm files - shipping without translations"
          fi
          # linuxdeploy rather than linuxdeployqt: the latter quit with a bare
          # exit code 1 immediately after "Found icons from desktop file" on this
          # Qt 6.8 build, printing no diagnostic. linuxdeploy and its qt plugin
          # are maintained and target Qt 6 directly.
          wget -c -nv "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          wget -c -nv "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage"
          chmod a+x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage
          export QMAKE="$(command -v qmake)"
          export ARCH=x86_64
          # EXTRA_QT_PLUGINS was silently ignored for these two - a build with it
          # set deployed only the qt plugin's own default set and shipped no
          # canbus directory at all, which costs the AppImage every Qt CAN
          # backend including socketcan. Copying them into the AppDir up front is
          # deterministic, and linuxdeploy still resolves their dependencies
          # because it walks every ELF file it finds under the AppDir.
          qt_plugins="$(qmake -query QT_INSTALL_PLUGINS)"
          for p in canbus iconengines; do
            if [ -d "$qt_plugins/$p" ]; then
              mkdir -p "appdir/usr/plugins/$p"
              cp -a "$qt_plugins/$p/." "appdir/usr/plugins/$p/"
            else
              echo "WARNING: $qt_plugins/$p not found"
            fi
          done
          ls -la appdir/usr/plugins/canbus
          ./linuxdeploy-x86_64.AppImage --appdir appdir \
            -d appdir/usr/share/applications/SavvyCAN.desktop \
            -i appdir/usr/share/icons/hicolor/256x256/apps/SavvyCAN.png \
            --plugin qt --output appimage
          ls -la ./*.AppImage

      - uses: actions/upload-artifact@v7
        with:
          name: SavvyCAN-Linux_x64.AppImage
          path: SavvyCAN-*x86_64.AppImage

  buildmacos86:
    name: macOS x64
    runs-on: macos-15-intel

    steps:
      - name: Clone
        uses: actions/checkout@v7

      - name: Prepare macOS Environment
        run: brew install libusb

      - name: Prepare Qt Libraries
        uses: jurplel/install-qt-action@v4
        with:
          modules: qtserialbus qtserialport

      - name: Compile
        run: |
          qmake CONFIG+=release CONFIG+=sdk_no_version_check SavvyCAN.pro
          make -j$(sysctl -n hw.ncpu)
          lrelease translations/*.ts

      - name: Package
        run: |
          set -x
          mkdir -p SavvyCAN.app/Contents/MacOS/translations
          mkdir -p SavvyCAN.app/Contents/MacOS/help
          shopt -s nullglob
          qm=(translations/*.qm)
          if [ ${#qm[@]} -gt 0 ]; then
            cp -R "${qm[@]}" SavvyCAN.app/Contents/MacOS/translations/
          else
            echo "WARNING: lrelease produced no .qm files - shipping without translations"
          fi
          cp -R help/* SavvyCAN.app/Contents/MacOS/help
          # macdeployqt deploys from a fixed plugin whitelist that has no entry for
          # QtSerialBus, so the canbus backends have to be placed by hand. Doing it
          # before macdeployqt runs means it still rewrites their library paths.
          if [ -d "$QT_ROOT_DIR/plugins/canbus" ]; then
            mkdir -p SavvyCAN.app/Contents/PlugIns/canbus
            cp -R "$QT_ROOT_DIR/plugins/canbus/." SavvyCAN.app/Contents/PlugIns/canbus/
          else
            echo "WARNING: no canbus plugins found under $QT_ROOT_DIR - the bundle will lack Qt CAN backends"
          fi
          # -dmg drives hdiutil, which is intermittently flaky on CI runners, so
          # report what macdeployqt actually did and give the image one retry
          # before failing the build.
          macdeployqt SavvyCAN.app -dmg -verbose=1 || echo "macdeployqt returned $?"
          if [ ! -f SavvyCAN.dmg ]; then
            echo "no DMG produced on the first attempt, retrying"
            rm -rf SavvyCAN.dmg
            hdiutil create -verbose -srcfolder SavvyCAN.app -volname SavvyCAN \
              -format UDZO -ov SavvyCAN.dmg
          fi
          test -f SavvyCAN.dmg
          mv SavvyCAN.dmg SavvyCAN_x64.dmg

      - uses: actions/upload-artifact@v7
        with:
          name: SavvyCAN-macOS_x64.dmg
          path: SavvyCAN_x64.dmg

  buildmacos-arm64:
    name: macOS ARM64
    runs-on: macos-15

    steps:
      - name: Clone
        uses: actions/checkout@v7

      - name: Prepare macOS Environment
        run: brew install libusb

      - name: Prepare Qt Libraries
        uses: jurplel/install-qt-action@v4
        with:
          modules: qtserialbus qtserialport

      - name: Compile
        run: |
          qmake CONFIG+=release CONFIG+=sdk_no_version_check SavvyCAN.pro
          make -j$(sysctl -n hw.ncpu)
          lrelease translations/*.ts

      - name: Package
        run: |
          set -x
          mkdir -p SavvyCAN.app/Contents/MacOS/translations
          mkdir -p SavvyCAN.app/Contents/MacOS/help
          shopt -s nullglob
          qm=(translations/*.qm)
          if [ ${#qm[@]} -gt 0 ]; then
            cp -R "${qm[@]}" SavvyCAN.app/Contents/MacOS/translations/
          else
            echo "WARNING: lrelease produced no .qm files - shipping without translations"
          fi
          cp -R help/* SavvyCAN.app/Contents/MacOS/help
          # macdeployqt deploys from a fixed plugin whitelist that has no entry for
          # QtSerialBus, so the canbus backends have to be placed by hand. Doing it
          # before macdeployqt runs means it still rewrites their library paths.
          if [ -d "$QT_ROOT_DIR/plugins/canbus" ]; then
            mkdir -p SavvyCAN.app/Contents/PlugIns/canbus
            cp -R "$QT_ROOT_DIR/plugins/canbus/." SavvyCAN.app/Contents/PlugIns/canbus/
          else
            echo "WARNING: no canbus plugins found under $QT_ROOT_DIR - the bundle will lack Qt CAN backends"
          fi
          # -dmg drives hdiutil, which is intermittently flaky on CI runners, so
          # report what macdeployqt actually did and give the image one retry
          # before failing the build.
          macdeployqt SavvyCAN.app -dmg -verbose=1 || echo "macdeployqt returned $?"
          if [ ! -f SavvyCAN.dmg ]; then
            echo "no DMG produced on the first attempt, retrying"
            rm -rf SavvyCAN.dmg
            hdiutil create -verbose -srcfolder SavvyCAN.app -volname SavvyCAN \
              -format UDZO -ov SavvyCAN.dmg
          fi
          test -f SavvyCAN.dmg
          mv SavvyCAN.dmg SavvyCAN_arm64.dmg

      - uses: actions/upload-artifact@v7
        with:
          name: SavvyCAN-macOS_ARM64.dmg
          path: SavvyCAN_arm64.dmg

  buildwindows:
    name: Windows x64
    runs-on: windows-2022

    steps:
      - name: Clone
        uses: actions/checkout@v7

      - name: Prepare Qt Libraries
        uses: jurplel/install-qt-action@v4
        with:
          modules: qtserialbus qtserialport

      - name: Compile
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          qmake CONFIG+=release SavvyCAN.pro || exit /b 1
          nmake || exit /b 1

      # windeployqt works out the Qt runtime instead of copying a hand-written
      # list of DLLs that silently rots whenever a dependency changes.
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item release\SavvyCAN.exe package\
          # The MSVC build links the VS2022 import library, so ship the matching DLL.
          Copy-Item third_party\libusb\VS2022\MS64\dll\libusb-1.0.dll package\
          windeployqt --release --no-translations package\SavvyCAN.exe
          # PowerShell does not expand wildcards in arguments to native programs,
          # and lrelease does no globbing of its own, so feed it real paths.
          New-Item -ItemType Directory -Force -Path package\translations | Out-Null
          Get-ChildItem translations\*.ts | ForEach-Object {
            lrelease $_.FullName -qm (Join-Path 'package\translations' ($_.BaseName + '.qm'))
            if ($LASTEXITCODE -ne 0) { throw "lrelease failed on $($_.Name) ($LASTEXITCODE)" }
          }
          # HelpWindow reads applicationDirPath()/help, so the docs have to ship.
          Copy-Item -Recurse help package\help
          Copy-Item -Recurse examples package\examples

      - uses: actions/upload-artifact@v7
        with:
          name: SavvyCAN-Windows_x64
          path: package

  pre-release:
    name: "pre-release"
    runs-on: "ubuntu-latest"
    needs: [buildwindows, buildmacos86, buildmacos-arm64, buildlinux]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      # v8 pairs with upload-artifact v7: it reads Content-Type before unzipping
      # so direct (unzipped) uploads survive, and a digest mismatch is now an
      # error rather than a warning. Both artifacts here are produced by the
      # upload steps above in the same run, so they arrive zipped as before.
      - uses: actions/download-artifact@v8

      - name: Zip the Windows build
        run: zip -r SavvyCAN-Windows_x64_CIBuild.zip SavvyCAN-Windows_x64

      - uses: "marvinpinto/action-automatic-releases@latest"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "continuous"
          prerelease: true
          title: "Development Build"
          files: |
            SavvyCAN-Linux_x64.AppImage/SavvyCAN-*x86_64.AppImage
            SavvyCAN-Windows_x64_CIBuild.zip
            SavvyCAN-macOS_x64.dmg/SavvyCAN_x64.dmg
            SavvyCAN-macOS_ARM64.dmg/SavvyCAN_arm64.dmg

  notify:
    name: Notify Discord
    runs-on: ubuntu-latest
    needs: [buildwindows, buildmacos86, buildmacos-arm64, buildlinux]
    # A fork without the webhook secrets should not turn the whole run red.
    continue-on-error: true
    # Job level, not step level: a step's own env: block is not visible to that
    # same step's if:, so the guard below would never see the secrets.
    env:
      WEBHOOK_ID: ${{ secrets.WEBHOOK_ID }}
      WEBHOOK_TOKEN: ${{ secrets.WEBHOOK_TOKEN }}
    steps:
      - name: Notify Discord
        if: ${{ env.WEBHOOK_ID != '' && env.WEBHOOK_TOKEN != '' }}
        # The commit message reaches the payload through jq --arg and an env var,
        # never through shell interpolation: a message containing a quote or a
        # backslash would otherwise produce invalid JSON and lose the notification.
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          payload=$(jq -n \
            --arg title "$REPO Build Complete" \
            --arg msg "$COMMIT_MESSAGE" \
            --arg sha "$SHA" \
            --arg url "https://github.com/$REPO/actions/runs/$RUN_ID#artifacts" \
            '{content: null, embeds: [{title: $title,
                                       description: ($msg + "\nCommit: " + $sha + "\n[Build Artifacts](" + $url + ")"),
                                       color: 5131997,
                                       author: {name: "Github Builds"}}]}')
          curl -sS -H "Content-Type: application/json" -X POST \
            --data "$payload" \
            "https://discord.com/api/webhooks/$WEBHOOK_ID/$WEBHOOK_TOKEN"
